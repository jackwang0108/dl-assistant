[project]
name = "pdf-mcp"
version = "2.0.0"
description = "Production-ready MCP server for PDF processing with intelligent caching. Extract text, search, and analyze PDFs with AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kevin Tan", email = "jingzheng.tan@gmail.com" }]
maintainers = [{ name = "Kevin Tan", email = "jingzheng.tan@gmail.com" }]
keywords = [
    "mcp",
    "pdf",
    "ai",
    "claude",
    "llm",
    "document-processing",
    "model-context-protocol",
    "anthropic",
    "pdf-extraction",
    "ai-agent",
    "pdf-reader",
    "document-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=3.4,<4",
    "pymupdf>=1.24.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12",
    "lxml>=5,<7",
    "defusedxml>=0.7",
    "regex>=2024.11",
]

[project.optional-dependencies]
structure = ["docling>=2.151,<3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "mypy>=1.8.0",
    "flake8>=7.0",
    "black>=25.0,<26",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/jztan/pdf-mcp"
Documentation = "https://github.com/jztan/pdf-mcp#readme"
Repository = "https://github.com/jztan/pdf-mcp"
Issues = "https://github.com/jztan/pdf-mcp/issues"
Changelog = "https://github.com/jztan/pdf-mcp/blob/master/CHANGELOG.md"

[project.scripts]
pdf-mcp = "pdf_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pymupdf"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pdf_mcp.extractor", "pdf_mcp.server"]
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: end-to-end tests against the real network (gated by PDF_MCP_RUN_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
