[project]
name = "paper-search-mcp"
version = "0.2.0"
description = "MCP server for searching academic papers"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.4,<4",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "respx>=0.21", "ruff>=0.4.0"]

[project.scripts]
paper-search-mcp = "paper_search_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "live: hits real upstream APIs (opt-in via RUN_LIVE_TESTS=1 env var)",
]
