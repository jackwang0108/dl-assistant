[project]
name = "tex-mcp"
version = "0.2.0"
description = "MCP server for parsing arXiv LaTeX source: sections, floats, cross-references, and bibliographies with caching."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "mcp",
    "latex",
    "arxiv",
    "ai",
    "llm",
    "document-processing",
    "model-context-protocol",
    "tex-parsing",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.0",
    "pylatexenc>=2.10,<3",
    "pybtex>=0.24,<0.27",
    "regex>=2024.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "pillow>=10.0",
    "mypy>=1.8.0",
    "flake8>=7.0",
    "black>=25.0,<26",
    "ruff>=0.15",
]

[project.scripts]
tex-mcp = "tex_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: end-to-end tests against the real network (gated by TEX_MCP_RUN_LIVE=1)",
]
